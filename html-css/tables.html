<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h3 align="center">STORE HOURS</h3>
    <!-- <tr> creates row -->
    <!-- <th> creates header cell -->
    <!-- <td> creates data cell -->
    <table width="500" border="2" align="center" style="background-color: lightgray;">
        <tr style="background-color: lightblue;">
            <th>Day</th>
            <th>Hours</th>
        </tr>
        <tr align="center">
            <td>Monday</td>
            <td>9:00am - 5:00pm</td>
        </tr>
        <tr align="center">
            <td>Tuesday</td>
            <td>9:00am - 5:00pm</td>
        </tr>
        <tr align="center">
            <td>Wednesday</td>
            <td>9:00am - 5:00pm</td>
        </tr>
        <tr align="center">
            <td>Thursday</td>
            <td>9:00am - 5:00pm</td>
        </tr>
        <tr align="center">
            <td>Friday</td>
            <td>9:00am - 5:00pm</td>
        </tr>
        <tr align="center">
            <td>Saturday</td>
            <td>10:00am - 2:00pm</td>
        </tr>
        <tr align="center">
            <td>Sunday</td>
            <td>Closed</td>
        </tr>
    </table>
</body>
</html>
