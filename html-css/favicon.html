<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 
    sets icon for website through link 
    'rel' is relationship between current document and linked document
    'type' is the MIME type of the linked document
    MIME type indicates the nature and format of a document
    'href' is the URL of the linked document
    -->
    <link rel="icon" type=""image/png" href="assets/favicon.png">
    
    <title>Favicon</title>
</head>
