<!DOCTYPE html>
<html>
    <head>
        <title>Images</title>
    </head>
    <body>
        <h1>This is my favorite picture!</h1>
        
        <!-- turns image into a clickable link -->
        <a href="https://www.youtube.com/watch?app=desktop&v=kqiDy4vfwZw&t=4m59s">
            <!-- 
            creates an image element
            'src' means source and is the image file
            'height' and width are the dimensions of the image
            'alt' is the alternative text
            -->
            <img src="assets/my_favorite_picture.webp" 
            height="200"
            width="350"
            alt="This is a picture of El and Max from Stranger Things">
        </a>

        <!-- creates an image element from gif -->
        <img src="assets/my_favorite_gif.gif" 
        width="350"
        alt="This is a gif of El and Max from Stranger Things">
        
        <!-- creates an image element from link -->
        <img src="https://www.thesun.co.uk/wp-content/uploads/2020/01/strangerthings-shopping2.jpg?strip=all&quality=100&w=1440&h=716&crop=1" 
        width="350"
        alt="This is a picture of El and Max from Stranger Things in a shopping spree!">
        
        <h3>Max and El are my favorite characters</h3>
    </body>
</html>
