<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Images</title>
    <style>
        body {
            /* avoids white color when scrolling excessively */
            background-color: black;

            /* can be link or image path */
            background-image: url("https://cdn.wallpapersafari.com/91/2/i2yDgN.jpg");
            
            /* avoids image repetition since it is default */
            background-repeat: no-repeat;

            /* centers the image */
            background-position: center;

            /* can be fixed (does not follow scroll) */
            background-attachment: fixed;

            /* takes up entire space of display */
            background-size: cover;
        }
    </style>
</head>
<body>
</body>
</html>
