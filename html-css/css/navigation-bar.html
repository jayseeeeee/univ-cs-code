<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        body {
            margin: 0;
        }
        main {
            margin: 20px;
        }
        h1 {
            color: red;
            text-align: center;
        }
        .navbar ul {
            background-color: lightcoral;
            list-style-type: none;
            overflow: hidden;
            padding: 0;
        }
        .navbar a {
            color: white;
            display: block;
            text-align: center;
            text-decoration: none;
            padding: 14px 16px;
        }
        .navbar a:hover {
            background-color: rgb(243, 161, 161);
        }
        .navbar li {
            float: left;
        }
    </style>
</head>
<body>
    <h1>STRANGER THINGS</h1>
    <nav class="navbar">
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Products</a></li>
            <li><a href="">Contact</a></li>
        </ul>
    </nav>
    <main>
        <h2>Welcome to the Upside Down</h2>
        <p>This is a sample page for demonstrating a navigation bar using HTML and CSS.</p>
    </main>
</body>
</html>
