<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows</title>
    <style>
        /* text shadow */
        h1 {
            /* horizontal offset, vertical offset, blur, red*/
            /* comma seperate for multiple shadow */
            text-shadow: 
            10px 2px 2px red,
            2px 10px 2px blue;
        }
        /* element shadow */
        div {
            width: 100px;
            height: 100px;
            background-color: green;
            box-shadow: 
            3px 3px 5px darkcyan, 
            9px 9px 2px rebeccapurple;
        }
    </style>
</head>
<body>
    <h1>Shadows</h1>
    <div></div>
</body>
</html>
