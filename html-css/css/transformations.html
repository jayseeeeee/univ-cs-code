<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformations</title>
    <style>
        /* translate */
        #box1 {
            transform: translateX(100%);
        }
        #box2 {
            transform: translateY(50%);
        }
        #box3 {
            transform: translate(200%, -50%);
        }
        /* rotation */
        #box4 {
            transform: rotateX(80deg);
        }
        #box5 {
            transform: rotateY(80deg);
        }
        #box6 {
            transform: rotateZ(80deg);
        }
        /* scale */
        /* 1.0 = 100% */
        #box7 {
            transform: scaleX(0.5)
        }
        #box8 {
            transform: scaleY(0.5)
        }
        #box9 {
            transform: scale(0.5, 0.5)
        }
        /* skew */
        #box10 {
            transform: skewX(10deg)
        }
        #box11 {
            transform: skewY(10deg)
        }
        #box12 {
            transform: skew(10deg, 10deg)
        }

        .special-box, .box {
            border: 0.05em solid;
            border-radius: 0.2em;
            font-size: 10em;
            text-align: center;
            height: 1.2em;
            width: 1.2em;
        }
        .special-box {
            transform: translateX(100%) rotateZ(45deg) scale(0.5)
        }
    </style>
</head>
<body>
    <h1>Translate</h1>
    <div class="box" id="box1">1</div>
    <div class="box" id="box2">2</div>
    <div class="box" id="box3">3</div>
    <h1>Rotate</h1>
    <div class="box" id="box4">4</div>
    <div class="box" id="box5">5</div>
    <div class="box" id="box6">6</div>
    <h1>Scale</h1>
    <div class="box" id="box7">7</div>
    <div class="box" id="box8">8</div>
    <div class="box" id="box9">9</div>
    <h1>Skew</h1>
    <div class="box" id="box10">10</div>
    <div class="box" id="box11">11</div>
    <div class="box" id="box12">12</div>
    <h1>Combined</h1>
    <div class="special-box">13</div>
    <div class="special-box">14</div>
    <div class="special-box">15</div>
</body>
</html>
