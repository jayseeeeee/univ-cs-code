<!DOCTYPE html>
<html>
    <head>
        <title>Hyperlinks</title>
    </head>
    <body>
        <!-- 
        'a' means anchor
        attribute modifies the behavior of element
        
        'href' means hypertext reference and is the link
        'target' means where to open the link
        'title' means tooltip text
        -->
        <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        target="_blank"
        title="Click for Surprise!">
            Click Me
        </a>
        
        <br>

        <!-- target local html documents -->
        <a href="lyrics.html">
            Song Lyrics
        </a>

        <br>

        <!-- target email services -->
        <a href="mailto:test@fake.com">
            Email Me
        </a>
    </body>
</html>
