<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Practical</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        main {
            background-color: pink; 
            background-image: url(https://www.rappler.com/tachyon/2023/09/Toni-Fowler.png); 
            background-repeat: no-repeat; 
            background-size: cover;
        }
        h1 {
            font-family: 'League Spartan';
            margin: 0;
        }
        h2 {
            margin-top: -10px;
            font-size: 20px;
            font-weight: 100;
            font-family: 'Open Sans';
        }
        button {
            width: auto
        }
    </style>
</head>
<body>
    <!-- header -->
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary" style="padding: 10px;">
            <div class="container-fluid">
                <!-- final project title -->
                <a class="navbar-brand" href="#" style="font-family: 'League Spartan'; color: palevioletred; font-weight: 1000; font-size: 25px;">FINAL PRACTICAL</a>
                <!-- side button when screen is small -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- navigation bar -->
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <!-- left navbar -->
                    <ul class="navbar-nav mx-auto">
                        <!-- instagram -->
                        <li class="nav-item">
                            <a class="nav-link" href="https://www.instagram.com/tonifowlerpo/?hl=en">Instagram</a>
                        </li>
                        <!-- facebook -->
                        <li class="nav-item">
                            <a class="nav-link" href="https://www.facebook.com/tonifowlerpo/">Facebook</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                              Music Videos
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="https://www.youtube.com/watch?v=bKPYYG5zqKM">MNM</a></li>
                                <li><a class="dropdown-item" href="https://www.youtube.com/watch?v=8DOqGTsNhw4">MPL</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="https://www.youtube.com/c/MOMMYTONIFOWLER">YouTube Channel</a></li>
                            </ul>
                        </li>
                    </ul>
                    <!-- right nav bar -->
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>
    
    <!-- main -->
    <main class="container-fluid text-center">
        <!-- login box -->
        <div class="row align-items-center" style="height: 100%;">
            <div class="col-8" style="padding: 0% 10%;">
                <div class="card" style="padding: 5% 0%;">

                    <form action="home.html">    
                        <!-- title -->
                        <h1>LOGIN TO YOUR ACCOUNT</h1>
                        <!-- subtitle -->
                        <h2>Use social networks to login instead!</h2>
                        <img style="height: 75px;" src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png" alt="">
                        <img style="height: 75px;" src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/1200px-Google_%22G%22_logo.svg.png" alt="">
                        <div class="align-items-center" style="text-align: left; padding: 0 20%;">
                            <!-- email address -->
                            <input style="margin: 10px 0;" type="email" class="form-control" id="email" placeholder="Username">
                            <!-- password -->
                            <input style="margin: 10px 0;" type="password" class="form-control" id="password" placeholder="Password">
                        </div>
                        <!-- submit & reset button -->
                        <button style="width: 25%;" class="btn btn-outline-primary">Submit</button>
                    </form>
                </div>
            </div>
            <!-- new here -->
            <div class="col d-flex flex-column justify-content-center" style="background-color: pink; height: 100%;">
                <h1>NEW HERE?</h1>
                <h2>Sign up and discover the true reality of the Toro Family!</h2>
                <a href="register.html"><button style="color: white; border-color: white;" class="btn btn-outline-primary">Sign-up</button></a>
            </div>
        </div>
    </main>
    <footer>
        WELCOME TO TONI-NETWORK
    </footer>
</body>
</html>
