<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Checked</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
        }
        button {
            border: none;
            border-radius: 0.8rem;
            box-shadow: 0 0.1rem 0.1rem rgb(0 0 0 / 0.15);
            color: dimgray;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 1rem 3rem;
            transition: 0.2s;
        }
        button:hover {
            background-color: darkred;
            color: white;
            box-shadow: 0 0.5rem 0.5rem rgb(255 0 0 / 0.15);
        }
        h1 {
            color: darkred;
            font-size: 2rem;
        }
        h2 {
            color: gray;
            font-size: 1.2rem;
        }
        input {
            cursor: pointer;
        }
        #age {
            color: #1e1e1e;
            display: inline-block;
            font-size: 3rem;
            font-weight: bold;
            line-height: 1.5;
        }
        #checkbox {
            accent-color: darkred;
            cursor: pointer;
            height: 1.5rem;
            margin: 1rem;
            width: 1.5rem;
        }
        #number {
            color: darkred;
            font-size: 3rem;
            font-weight: bold;
            height: 4rem;
            margin: 1.5rem;
            text-align: center;
            width: 6rem;
        }
        #residence {
            display: inline-block;
            font-size: 1.5rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<h2>Choose your role</h2>
<label for="paladin">Paladin</label><input type="radio" name="role" id="paladin"> <br>
<label for="mage">Mage</label><input type="radio" name="role" id="mage"> <br>
<label for="sorcerer">Sorcerer</label><input type="radio" name="role" id="sorcerer"> <br>
<label for="bard">Bard</label><input type="radio" name="role" id="bard"> <br>
<label for="ranger">Ranger</label><input type="radio" name="role" id="ranger"> <br>
<label for="zoomer">Zoomer</label><input type="radio" name="role" id="zoomer"> <br>
<label for="checkbox">Do you accept the risk?</label><input type="checkbox" name="" id="checkbox"> <br>
<button type="submit" id="submit">Confirm Role</button>
<h2 id="role"></h2>
<h1 id="name"></h1>
</body>
<script>
    // Checked is a property that determines the checked state of an HTML checkbox or radio button element.

    // Radio
    const paladin = document.getElementById('paladin');
    const mage = document.getElementById('mage');
    const sorcerer = document.getElementById('sorcerer');
    const bard = document.getElementById('bard');
    const ranger = document.getElementById('ranger');
    const zoomer = document.getElementById('zoomer');

    // Checkbox
    const checkbox = document.getElementById('checkbox');

    const submit = document.getElementById('submit');
    const role = document.getElementById('role');
    const name = document.getElementById('name');
    
    submit.onclick = function () {
        // Determine checkbox state
        if (checkbox.checked) {
            // Determine check state of radio buttons
            if (paladin.checked) {
                role.textContent = `Your selected role is Paladin`
                name.textContent = `Welcome, Mike!`
            } else if (mage.checked) {
                role.textContent = `Your selected mage is Mage`
                name.textContent = `Welcome, Eleven!`
            } else if (sorcerer.checked) {
                role.textContent = `Your selected wizard is Sorcerer`
                name.textContent = `Welcome, Will!`
            } else if (bard.checked) {
                role.textContent = `Your selected bard is Bard`
                name.textContent = `Welcome, Dustin!`
            } else if (ranger.checked) {
                role.textContent = `Your selected ranger is Ranger`
                name.textContent = `Welcome, Lucas!`
            } else if (zoomer.checked) {
                role.textContent = `Your selected zoomer is Zoomer`
                name.textContent = `Welcome, Max!`
            } else {
                role.textContent = `Sorry, you must select a role!`
            }
        } else {
            role.textContent = `Sorry, you must accept the risk!`
        }
    }
</script>
</html>
