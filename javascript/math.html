<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Math</title>
</head>
<body>
<script>
    <!-- Math is a built-in object that provides a collection of mathematical methods and properties -->
    console.log(`Value of PI is`,Math.PI)
    console.log(`Euler's number is`, Math.E)
    console.log(`Rounded value of 45.67 is`,Math.round(45.67))
    console.log(`Rounded down value of 45.67 is`, Math.floor(45.67))
    console.log(`Rounded up value of 45.67 is`, Math.ceil(45.67))
    console.log(`Removed decimal value of 45.67 is`, Math.trunc(45.67))
    console.log(`2 raised to 4 is`, Math.pow(2, 4))
    console.log(`Square root of 16 is`, Math.sqrt(16))
    console.log(`Natural logarithm of 16 is`, Math.log(16))
    console.log(`Sin of 45 is`, Math.log(45))
    console.log(`Cos of 45 is`, Math.cos(45))
    console.log(`Tan of 45 is`, Math.tan(45))
    console.log(`The absolute value of -45.67 is`, Math.abs(-45.67))
    console.log(`The sign of -45.67 is`, Math.sign(-45.67))
    console.log(`The largest value of 4, 2, and 0 is`, Math.max(4, 2, 0))
    console.log(`The smallest value of 4, 2, and 0 is`, Math.min(4, 2, 0))
    console.log(`Randomly generated value is`, Math.random());
</script>
</body>
</html>
