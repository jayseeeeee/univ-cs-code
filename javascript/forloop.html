<script>
    // For Loop repeats a block of code for a limited amount of time.
    console.log("Standard For Loop");
    for (let i = 0; i < 10; i++) { // Starting Number; Condition; Increment
        if (i === 5) {
            continue; // Skips over the current iteration
        } else if (i === 8) {
            break // Stops the loop
        }
        console.log(i);
    }

    // Multiplicative For Loop
    console.log("Multiplicative For Loop");
    for (let i = 2; i <= 2048; i *= 2) { // Starting Number; Condition; Increment
        console.log(i);
    }
    
    // Reverse For Loop
    console.log("Reverse For Loop");
    for (let i = 10; i > 0; i--) {
        console.log(i);
    }
</script>
