    <title>Logical Operators</title>

<body>

</body>
<script>
    // Logical Operators are used to combine or manipulate boolean false (true or false)
    let age = 14;
    let gender = 'Female'
    let hasPowers = true
    
    // AND (&&)
    if (age >= 12 && age < 18) {
        console.log(`Welcome to the party, stranger!`);
    } else {
        console.log(`Sorry, you do not meet the age requirements to join.`);
    }
    
    // OR (||)
    if (gender == 'Male' || hasPowers) {
        console.log(`You are cool, welcome to the party!`);
    } else {
        console.log(`Sorry, we do not accept different species (unless you're cool).`);
    }
     
    // NOT (!)
    if (!hasPowers) {
        console.log(`You are not from Hawkins Lab.`);
    } else {
        console.log(`You came from Hawkins Lab!`);
    }
</script>
</html>
